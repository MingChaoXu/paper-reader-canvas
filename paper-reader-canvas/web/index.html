<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Reader</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./polyfills.mjs"></script>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header>
    <div class="heading">
      <div>
        <h1>Paper Reader</h1>
        <p id="document-name">在侧栏阅读 PDF，划词后询问 Copilot</p>
      </div>
      <div class="reader-controls">
        <form id="page-form" class="page-navigation" aria-label="页码导航" novalidate>
          <button id="previous-page" type="button" aria-label="上一页" title="上一页" disabled>‹</button>
          <label for="page-number">第</label>
          <input id="page-number" type="number" min="1" step="1" inputmode="numeric" enterkeyhint="go" aria-label="页码，输入后按 Enter 跳转" disabled>
          <span id="page-total">/ 0</span><span>页</span>
          <button id="page-go" type="submit" disabled>跳转</button>
          <button id="next-page" type="button" aria-label="下一页" title="下一页" disabled>›</button>
        </form>
        <div class="zoom" aria-label="页面缩放" title="滚轮缩放；Shift + 滚轮翻页">
          <button id="zoom-out" type="button" aria-label="缩小">−</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in" type="button" aria-label="放大">+</button>
        </div>
      </div>
    </div>
    <form id="path-form">
      <label for="path">本地 PDF 路径（相对于当前项目，或绝对路径）</label>
      <div class="path-row">
        <input id="path" name="path" placeholder="doc/paper.pdf" autocomplete="off">
        <button type="submit">打开</button>
      </div>
    </form>
    <div class="file-row">
      <label class="file-button" for="file">或选择本机 PDF</label>
      <input id="file" type="file" accept=".pdf,application/pdf">
      <span class="wheel-hint">滚轮缩放 · Shift+滚轮翻页</span>
      <span id="page-count"></span>
    </div>
  </header>
  <main id="viewer" aria-label="PDF 阅读区">
    <div id="empty">输入 PDF 路径，或从本机选择文件。论文仅在本机显示；只有选中的文字会发往 Copilot。</div>
  </main>
  <footer>
    <p id="selection-label">尚未选中文字</p>
    <div id="selection-preview" aria-live="polite">划选论文中的英文单词、句子或段落。</div>
    <div class="reader-actions">
      <button id="translate" type="button" disabled>翻译选中内容</button>
      <button id="speak-selection" type="button" disabled>英文发音</button>
      <button id="speak-translation" type="button" disabled>朗读译文</button>
      <button id="stop-speech" type="button" disabled>停止朗读</button>
    </div>
    <div class="speech-controls">
      <label class="inline-label"><input id="auto-read" type="checkbox" disabled> 翻译后自动朗读</label>
      <label class="inline-label" for="speech-rate">语速
        <select id="speech-rate">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <details class="voice-options">
        <summary>系统声音</summary>
        <label for="english-voice">英文 <select id="english-voice" disabled></select></label>
        <label for="chinese-voice">中文 <select id="chinese-voice" disabled></select></label>
      </details>
    </div>
    <p id="speech-status" role="status" aria-live="polite">正在检查本机语音…</p>
    <details id="translation-panel" hidden>
      <summary id="translation-label">译文</summary>
      <div id="translation-text"></div>
    </details>
    <audio id="speech-audio" preload="auto" hidden></audio>
    <p id="status" role="status" aria-live="polite">划词后也可以在会话里说“翻译刚选中的文字”。</p>
  </footer>
</body>
</html>
